server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compresión: menos datos en conexiones móviles/rurales
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # La API se sirve en el mismo origen: sin CORS
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # JS, CSS y fuentes llevan hash en el nombre (Angular): caché de 1 año, inmutables.
  # Otros archivos (favicon, robots.txt) no llevan hash y van por la regla general.
  location ~* \.(?:js|css|woff2?)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html nunca se cachea, para recibir siempre la última versión
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
